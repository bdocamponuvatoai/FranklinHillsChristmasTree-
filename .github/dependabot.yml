version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing new releases (security updates are not delayed).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Next.js and React must move together.
      next-react:
        patterns:
          ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        dependency-type: development
        exclude-patterns: ["eslint-config-next", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing new releases (security updates are not delayed).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
